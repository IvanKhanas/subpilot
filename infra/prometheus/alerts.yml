groups:
  - name: subpilot
    interval: 15s
    rules:

      - alert: Http5xxRateHigh
        expr: |
          sum by (application) (
            rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx rate on {{ $labels.application }}"
          description: "{{ $labels.application }} is returning {{ $value | printf \"%.3f\" }} 5xx/s over the last 5 minutes."

      - alert: ApiP99LatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (application, le) (
              rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow p99 latency on {{ $labels.application }}"
          description: "p99 response time on {{ $labels.application }} is {{ $value | printf \"%.2f\" }}s (threshold: 2s)."

      - alert: OutboxBacklogHigh
        expr: outbox_backlog_size > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment outbox backlog is growing"
          description: "{{ $value }} events pending in outbox for over 5 minutes."

      - alert: OutboxBacklogCritical
        expr: outbox_backlog_size > 200
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Payment outbox backlog is critically high"
          description: "{{ $value }} events pending — outbox publisher may be stuck. Payments may not reach Kafka."

      - alert: WebhookFailureDetected
        expr: increase(webhook_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "YooKassa webhook processing failure"
          description: "{{ $value | printf \"%.0f\" }} webhook failure(s) in the last 10 minutes."

      - alert: KafkaConsumerLagHigh
        expr: |
          sum by (application, topic) (
            kafka_consumer_fetch_manager_records_lag{topic!=""}
          ) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high on {{ $labels.application }}"
          description: "Topic {{ $labels.topic }} lag is {{ $value | printf \"%.0f\" }} messages on {{ $labels.application }}."

      - alert: KafkaConsumerLagCritical
        expr: |
          sum by (application, topic) (
            kafka_consumer_fetch_manager_records_lag{topic!=""}
          ) > 1000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer lag critically high on {{ $labels.application }}"
          description: "Topic {{ $labels.topic }} lag is {{ $value | printf \"%.0f\" }} messages — consumer may be stuck."