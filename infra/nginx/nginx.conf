events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream payment-service {
        server payment-service:8084;
    }

    upstream gateway-service {
        server gateway-service:8088;
    }

    # YooKassa IP whitelist
    geo $yookassa_allowed {
        default          0;
        185.71.76.0/27   1;
        185.71.77.0/27   1;
        77.75.153.0/25   1;
        77.75.156.11/32  1;
        77.75.156.35/32  1;
        77.75.154.128/25 1;
        2a02:5180::/32   1;
    }

    # HTTP: health check stays on 80, everything else → HTTPS
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: all public traffic
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         DENY;
        add_header Referrer-Policy         no-referrer;

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /payment/webhook {
            if ($yookassa_allowed = 0) {
                return 403;
            }
            proxy_pass         http://payment-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID      $request_id;
        }

        location /api/v1/ {
            proxy_pass         http://gateway-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID      $request_id;
        }

        location / {
            return 404;
        }
    }
}
