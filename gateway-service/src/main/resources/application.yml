spring:
  application:
    name: gateway-service

server:
  port: ${GATEWAY_SERVER_PORT:8088}

gateway:
  auth:
    jwt:
      secret: ${ADMIN_AUTH_JWT_SECRET}
      issuer: ${ADMIN_AUTH_JWT_ISSUER:subpilot-admin}
      audience: ${ADMIN_AUTH_JWT_AUDIENCE:subpilot-api}
      access-ttl-seconds: ${ADMIN_AUTH_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${ADMIN_AUTH_REFRESH_TTL_SECONDS:1209600}
  internal-jwt:
    secret: ${ADMIN_JWT_SECRET}
    ttl-seconds: ${GATEWAY_INTERNAL_JWT_TTL_SECONDS:60}
  routes:
    - id: admin-auth
      path-prefix: /api/v1/auth
      target-base-url: ${ADMIN_SERVICE_BASE_URL:http://admin-service:8086}
    - id: admin-service
      path-prefix: /api/v1/admin
      target-base-url: ${ADMIN_SERVICE_BASE_URL:http://admin-service:8086}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
