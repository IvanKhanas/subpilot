spring:
  liquibase:
    enabled: false
  grpc:
    server:
      port: 0
    client:
      channels:
        subscription-service:
          address: localhost:9999

grpc:
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    backoff-multiplier: 3.0

yookassa:
  shop-id: test-shop-id
  secret-key: test-secret-key
  return-url: https://example.com/return

yookassa-outbox:
  scheduler-interval: 24h
  batch-size: 10
