spring:
  application:
    name: admin-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USER:admin}
    password: ${ADMIN_DB_PASSWORD:admin}
  jpa:
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200
  liquibase:
    enabled: false
  grpc:
    client:
      channels:
        subscription-service:
          address: ${SUBSCRIPTION_GRPC_ADDRESS:localhost:9091}
        loyalty-service:
          address: ${LOYALTY_GRPC_ADDRESS:localhost:9095}
        payment-service:
          address: ${PAYMENT_GRPC_ADDRESS:localhost:9094}
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${ADMIN_JWT_SECRET}

admin:
  auth:
    jwt:
      secret: ${ADMIN_AUTH_JWT_SECRET}
      issuer: ${ADMIN_AUTH_JWT_ISSUER:subpilot-admin}
      audience: ${ADMIN_AUTH_JWT_AUDIENCE:subpilot-api}
      access-ttl-seconds: ${ADMIN_AUTH_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${ADMIN_AUTH_REFRESH_TTL_SECONDS:1209600}
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      scopes: ${ADMIN_BOOTSTRAP_SCOPES:admin.read admin.write}

server:
  port: ${ADMIN_SERVER_PORT:8086}
  servlet:
    context-path: /api/v1

management:
  server:
    port: 8087
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
