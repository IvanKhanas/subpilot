syntax = "proto3";

package subpilot.moderation.v1;

option java_package = "com.xeno.subpilot.proto.moderation.v1";
option java_multiple_files = true;

service ModerationService {
  rpc NotifyFlaggedPrompt(FlaggedPromptNotification) returns (NotifyResponse);
}

message FlaggedPromptNotification {
  int64 user_id = 1;
  int64 chat_id = 2;
  string prompt_text = 3;
  repeated string flagged_categories = 4;
}

message NotifyResponse {}